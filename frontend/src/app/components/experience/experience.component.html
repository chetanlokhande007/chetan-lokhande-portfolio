<div class="experience-column">
  <span class="section-tag">EXPERIENCE</span>
  <h2 class="section-title section-title-light">My Professional Journey</h2>

  <div class="experience-timeline">
    @for (item of experiences; track item.role) {
      <div class="experience-item">
        <div class="experience-icon-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>

        <div class="experience-card">
          <div class="experience-header">
            <div>
              <h3 class="experience-role">{{ item.role }}</h3>
              <h4 class="experience-company">{{ item.context }}</h4>
            </div>
          </div>

          <p class="experience-desc">{{ item.description }}</p>

          <ul class="experience-responsibilities">
            @for (resp of item.responsibilities; track resp) {
              <li>{{ resp }}</li>
            }
          </ul>

          <div class="experience-tech-tags">
            @for (tech of item.technologies; track tech) {
              <span class="badge badge-light">{{ tech }}</span>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>
