<div class="education-column">
  <span class="section-tag">EDUCATION</span>
  <h2 class="section-title section-title-light">Academic Background</h2>

  <div class="education-list">
    @for (item of educationList; track item.degree) {
      <div class="education-card">
        <div class="education-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>

        <div class="education-content">
          <div class="education-header">
            <div>
              <h3 class="degree-title">{{ item.degree }}</h3>
              <h4 class="institution-name">{{ item.institution }}</h4>
            </div>
            <span class="year-badge">{{ item.year }}</span>
          </div>

          @if (item.grade) {
            <div class="grade-pill">
              <span class="grade-label">Academic Distinction:</span>
              <span class="grade-value">{{ item.grade }}</span>
            </div>
          }

          @if (item.highlight) {
            <p class="education-desc">{{ item.highlight }}</p>
          }
        </div>
      </div>
    }
  </div>
</div>
