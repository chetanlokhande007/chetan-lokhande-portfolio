<header class="navbar" role="banner">
  <div class="container nav-container">
    <a href="#hero" class="brand" aria-label="Chetan Lokhande - Portfolio Home">
      <span class="brand-code">&lt;</span>Chetan.Dev<span class="brand-code">/&gt;</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav-links" aria-label="Main Navigation">
      <a href="#about" class="nav-link">About</a>
      <a href="#skills" class="nav-link">Skills</a>
      <a href="#projects" class="nav-link">Projects</a>
      <a href="#experience" class="nav-link">Experience</a>
      <a href="#education" class="nav-link">Education</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>

    <div class="nav-actions">
      <a href="Chetan-Lokhande-Resume.pdf" download="Chetan-Shantaram-Lokhande-Resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm resume-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Resume
      </a>
      <a href="#contact" class="btn btn-primary btn-sm">Get in Touch</a>
      <button 
        class="mobile-toggle" 
        [attr.aria-expanded]="mobileMenuOpen()" 
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  @if (mobileMenuOpen()) {
    <nav class="mobile-menu" aria-label="Mobile Navigation">
      <a href="#about" class="mobile-nav-link" (click)="closeMenu()">About</a>
      <a href="#skills" class="mobile-nav-link" (click)="closeMenu()">Skills</a>
      <a href="#projects" class="mobile-nav-link" (click)="closeMenu()">Projects</a>
      <a href="#experience" class="mobile-nav-link" (click)="closeMenu()">Experience</a>
      <a href="#education" class="mobile-nav-link" (click)="closeMenu()">Education</a>
      <a href="#contact" class="mobile-nav-link" (click)="closeMenu()">Contact</a>
      <a href="Chetan-Lokhande-Resume.pdf" download="Chetan-Shantaram-Lokhande-Resume.pdf" target="_blank" class="mobile-nav-link resume-link" (click)="closeMenu()">
        Download Resume (PDF)
      </a>
    </nav>
  }
</header>
